
name: Build Frago Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build Frago
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # 1. دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. نصب Java
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. استخراج ZIP و تشخیص پروژه
      - name: Extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname '*.zip' \
            -not -path '*/output/*' \
            -printf '%T@\t%p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -f2- || true)"

          if [[ -z "$ZIP" ]]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "Selected ZIP: $ZIP"

          mkdir -p "$RUNNER_TEMP/frago-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/frago-source"

          PROJECT="$(find "$RUNNER_TEMP/frago-source" \
            -type f -name gradlew \
            -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: Gradle project not found inside ZIP."
            exit 1
          fi

          if [[ ! -f "$PROJECT/app/build.gradle" && \
                ! -f "$PROJECT/app/build.gradle.kts" ]]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Project detected:"
          echo "$PROJECT"

      # 4. نصب Java و Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 5. نصب SDK و NDK
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          if [[ ! -x "$NDK/ndk-build" ]]; then
            echo "ERROR: NDK installation failed."
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      # 6. بررسی ساختار پروژه
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/src/main/AndroidManifest.xml

          echo "Gradle configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "Android project validation passed."

      # 7. نصب Go نسخه موردنیاز libXray
      - name: Setup Go 1.27.3
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: true

      # 8. تنظیم و بررسی Toolchain
      - name: Verify Go toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"

          export GOTOOLCHAIN=auto

          go version
          go env GOVERSION
          go env GOTOOLCHAIN

      # 9. نصب ابزارهای موردنیاز موتور
      - name: Install Xray build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            unzip \
            zip \
            make \
            clang \
            cmake

          python3 --version
          git --version
          go version

      # 10. دریافت و ساخت موتور Xray
      - name: Build libXray Android engine
        shell: bash
        run: |
          set -euo pipefail

          export GOTOOLCHAIN=auto
          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT

          mkdir -p "$PROJECT_DIR/app/libs"

          git clone --depth 1 \
            https://github.com/XTLS/libXray.git \
            "$RUNNER_TEMP/libXray"

          cd "$RUNNER_TEMP/libXray"

          echo "libXray Go requirements:"
          head -n 10 go.mod

          echo "Go version:"
          go version

          python3 build/main.py android

          AAR="$(find "$RUNNER_TEMP/libXray" \
            -type f \
            -iname '*.aar' \
            -print -quit)"

          if [[ -z "$AAR" || ! -s "$AAR" ]]; then
            echo "ERROR: libXray AAR was not generated."

            find "$RUNNER_TEMP/libXray" \
              -type f \
              | grep -Ei '\.(aar|so)$' || true

            exit 1
          fi

          echo "Generated AAR:"
          ls -lh "$AAR"

          cp "$AAR" "$PROJECT_DIR/app/libs/libXray.aar"

          echo "Checking ARM64 native libraries:"

          unzip -l "$PROJECT_DIR/app/libs/libXray.aar" \
            | grep 'jni/arm64-v8a/' || {
              echo "ERROR: ARM64 library missing from AAR."
              exit 1
            }

          echo "libXray engine copied successfully."

      # 11. بررسی وابستگی موتور در Gradle
      - name: Verify Xray dependency
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if ! grep -Rqs \
            'libXray.aar\|libs/\*\.aar' \
            app/build.gradle app/build.gradle.kts 2>/dev/null; then
            echo "ERROR: libXray.aar is not declared as a Gradle dependency."
            echo "The AAR was built but is not linked to the Android app."
            exit 1
          fi

          echo "Xray dependency declaration found."

      # 12. ساخت APK
      - name: Build Frago APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT
          export GOTOOLCHAIN=auto

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # 13. بررسی خروجی
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

          echo "APK size:"
          du -h "$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

          echo "APK SHA256:"
          sha256sum "$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

      # 14. بررسی معماری APK
      - name: Verify APK architecture
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

          unzip -l "$APK" | grep 'lib/arm64-v8a/' || {
            echo "WARNING: ARM64 native libraries were not found."
          }

          echo "APK architecture inspection completed."

      # 15. انتشار APK
      - name: Upload Frago APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.2.0-Android-APK
          path: output/Frago-1.2.0.apk
          if-no-files-found: error
          retention-days: 30

      # 16. ذخیره گزارش‌ها در صورت خطا یا موفقیت
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frago-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
