
name: Frago ARM64 APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '*.zip'
      - '.github/workflows/build-arm64-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build Frago
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Frago ZIP automatically
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/frago-extracted"

          FOUND=""

          while IFS= read -r ZIP; do
            echo "Checking ZIP: $ZIP"

            TEMP_DIR="$(mktemp -d "$RUNNER_TEMP/frago-test-XXXXXX")"

            if ! unzip -q "$ZIP" -d "$TEMP_DIR"; then
              rm -rf "$TEMP_DIR"
              continue
            fi

            GRADLE_FILE="$(find "$TEMP_DIR" -type f -name gradlew -print -quit)"

            if [ -n "$GRADLE_FILE" ]; then
              PROJECT_DIR="$(dirname "$GRADLE_FILE")"

              if [ -f "$PROJECT_DIR/settings.gradle" ] || [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
                if [ -f "$PROJECT_DIR/app/build.gradle" ] || [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
                  FOUND="$PROJECT_DIR"
                  break
                fi
              fi
            fi

            rm -rf "$TEMP_DIR"

          done < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' ! -iname '*logs*' | sort)

          if [ -z "$FOUND" ]; then
            echo "ERROR: No valid Android Gradle project found in ZIP files."
            echo "Repository ZIP files:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip'
            exit 1
          fi

          echo "Frago project detected at: $FOUND"
          echo "PROJECT_ROOT=$FOUND" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;27.2.12479018"

      - name: Set up Java 11 for Gradle 7.2
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify extracted project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Project directory: $PWD"

          test -f gradlew
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/default-config.json

          chmod +x gradlew

          echo "Project structure verified."

      - name: Verify Frago configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(".")
          config = json.loads(
              (root / "app/src/main/assets/default-config.json").read_text()
          )

          assert config["dns"]["servers"] == [
              "https://kid.openbld.net/dns-query"
          ]

          assert config["dns"]["queryStrategy"] == "UseIPv4"

          socks = next(
              x for x in config["inbounds"]
              if x.get("protocol") == "socks"
          )

          assert socks["port"] == 10808
          assert socks["listen"] == "127.0.0.1"
          assert socks["settings"]["udp"] is True

          fragment = next(
              x for x in config["outbounds"]
              if x.get("tag") == "fragment-out"
          )

          assert fragment["settings"]["fragment"] == {
              "packets": "tlshello",
              "length": "10-400",
              "interval": "1-30"
          }

          ET.parse(root / "app/src/main/AndroidManifest.xml")

          assert (
              root / "app/src/main/java/net/typeblog/socks/FragoVpnService.java"
          ).is_file()

          assert (
              root / "app/src/main/java/net/typeblog/socks/core/FragoSocksServer.java"
          ).is_file()

          print("Frago configuration checks passed.")
          PY

      - name: Build Hev SOCKS5 engine for ARM64
        shell: bash
        run: |
          set -euo pipefail

          HEV_ROOT="$RUNNER_TEMP/hev-android-build"

          mkdir -p "$HEV_ROOT"

          git clone \
            --depth 1 \
            --branch 2.20.0 \
            --recurse-submodules \
            https://github.com/heiher/hev-socks5-tunnel.git \
            "$HEV_ROOT/jni"

          "$ANDROID_SDK_ROOT/ndk/27.2.12479018/ndk-build" \
            -C "$HEV_ROOT" \
            APP_ABI=arm64-v8a

          LIB="$(find "$HEV_ROOT" \
            -type f \
            -path '*/arm64-v8a/libhev-socks5-tunnel.so' \
            -print -quit)"

          if [ -z "$LIB" ]; then
            echo "ERROR: ARM64 Hev library was not generated."
            find "$HEV_ROOT" -type f -name '*.so'
            exit 1
          fi

          mkdir -p "$PROJECT_ROOT/app/src/main/jniLibs/arm64-v8a"

          install -m 644 "$LIB" \
            "$PROJECT_ROOT/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so"

          cp "$HEV_ROOT/jni/LICENSE" \
            "$PROJECT_ROOT/app/src/main/assets/THIRD_PARTY_HEV_LICENSE.txt"

          cp "$HEV_ROOT/jni/LICENSE" \
            "$PROJECT_ROOT/THIRD_PARTY_HEV_LICENSE.txt"

      - name: Build Debug and Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            clean \
            assembleDebug \
            assembleRelease

      - name: Verify generated APKs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          echo "Checking ARM64 release APK..."

          unzip -l "$RELEASE_APK" > "$RUNNER_TEMP/apk-list.txt"

          grep -q 'lib/arm64-v8a/libhev-socks5-tunnel.so' \
            "$RUNNER_TEMP/apk-list.txt"

          if grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/|libxray' \
            "$RUNNER_TEMP/apk-list.txt"; then
            echo "Unexpected architecture or Xray library found."
            exit 1
          fi

          echo "APK verification passed."

          mkdir -p "$GITHUB_WORKSPACE/frago-output"

          cp "$DEBUG_APK" "$GITHUB_WORKSPACE/frago-output/"
          cp "$RELEASE_APK" "$GITHUB_WORKSPACE/frago-output/"

          cp THIRD_PARTY_HEV_LICENSE.txt \
            "$GITHUB_WORKSPACE/frago-output/" || true

          ls -lh "$GITHUB_WORKSPACE/frago-output"

      - name: Upload Frago APKs
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APKs
          path: frago-output/*
          if-no-files-found: error
          retention-days: 14
