
name: Build Frago Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build Frago
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      # 1. دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. نصب Java
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. استخراج ZIP و تشخیص پروژه
      - name: Extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""

          if [[ -n "${SOURCE_ZIP:-}" && -f "${SOURCE_ZIP}" ]]; then
            ZIP="$SOURCE_ZIP"
          else
            ZIP="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              -not -path '*/output/*' \
              -printf '%T@\t%p\n' \
              | sort -nr \
              | head -n 1 \
              | cut -f2- || true)"
          fi

          if [[ -z "$ZIP" ]]; then
            echo "ERROR: No source ZIP found in repository."
            exit 1
          fi

          echo "Selected ZIP: $ZIP"

          mkdir -p "$RUNNER_TEMP/frago-source"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/frago-source"

          PROJECT="$(find "$RUNNER_TEMP/frago-source" \
            -type f -name gradlew \
            -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: Gradle project not found in ZIP."
            find "$RUNNER_TEMP/frago-source" -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [[ ! -f "$PROJECT/app/build.gradle" && \
                ! -f "$PROJECT/app/build.gradle.kts" ]]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Extracted project:"
          echo "$PROJECT"

      # 4. نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # 5. نصب SDK و NDK
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          test -x "$NDK/ndk-build"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      # 6. بررسی ساختار پروژه
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/src/main/AndroidManifest.xml

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "Android project validation passed."

      # 7. نصب Go
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      # 8. ساخت موتور Xray
      - name: Build libXray engine
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/app/libs"

          git clone --depth 1 \
            https://github.com/XTLS/libXray.git \
            "$RUNNER_TEMP/libXray"

          cd "$RUNNER_TEMP/libXray"

          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT

          python3 build/main.py android

          AAR="$(find "$RUNNER_TEMP/libXray" \
            -type f -iname '*.aar' -print -quit)"

          if [[ -z "$AAR" || ! -s "$AAR" ]]; then
            echo "ERROR: libXray AAR was not generated."
            find "$RUNNER_TEMP/libXray" -type f \
              | grep -Ei '\.(aar|so)$' || true
            exit 1
          fi

          echo "Generated engine:"
          ls -lh "$AAR"

          cp "$AAR" "$PROJECT_DIR/app/libs/libXray.aar"

          echo "Xray engine copied."

      # 9. ساخت APK
      - name: Build Frago APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # 10. بررسی خروجی
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

          echo "APK size:"
          du -h "$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

          echo "APK SHA256:"
          sha256sum "$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

      # 11. ذخیره APK به عنوان Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.2.0-Android-APK
          path: output/Frago-1.2.0.apk
          if-no-files-found: error
          retention-days: 30

      # 12. ذخیره گزارش ساخت
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frago-build-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/
            ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
