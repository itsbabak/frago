
name: Build Frago Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Frago APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. Checkout
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Detect project
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          PROJECT=""

          if [[ -f "$WORK/gradlew" ]]; then
            PROJECT="$WORK"
          else
            ZIP_FILE="$(find "$WORK" -maxdepth 5 \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' | head -n 1 || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "Android source not found"
              exit 1
            fi

            mkdir -p "$WORK/frago-extracted"
            unzip -q "$ZIP_FILE" -d "$WORK/frago-extracted"

            PROJECT="$(find "$WORK/frago-extracted" \
              -type f -name gradlew -print -quit | xargs -r dirname)"
          fi

          if [[ -z "$PROJECT" || ! -f "$PROJECT/app/build.gradle" ]]; then
            echo "Invalid Android project"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      # 3. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 4. Configure Android SDK manually
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "SDK Manager: $SDKMANAGER"

          "$SDKMANAGER" --version

      # 5. Install SDK and NDK
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_HOME/ndk/28.2.13676358"

          if [[ ! -x "$NDK/ndk-build" ]]; then
            echo "ERROR: NDK installation failed"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "SDK and NDK installed successfully"

      # 6. Validate
      - name: Validate Frago source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew
          chmod +x app/src/main/build-byedpi.sh

          test -f settings.gradle
          test -f build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/jni/Android.mk
          test -f app/src/main/jni/Application.mk
          test -f app/src/main/build-byedpi.sh

          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'ndkVersion "28.2.13676358"' app/build.gradle
          grep -q 'abiFilters "arm64-v8a", "armeabi-v7a"' app/build.gradle

          echo "Frago source validation successful"

          java -version
          "$ANDROID_NDK_HOME/ndk-build" --version

      # 7. Build
      - name: Build Frago APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "APK not generated"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name '*.apk' || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/Frago-1.1.10.apk"

          ls -lh "$GITHUB_WORKSPACE/output/Frago-1.1.10.apk"
          sha256sum "$GITHUB_WORKSPACE/output/Frago-1.1.10.apk"

      # 9. Upload
      - name: Upload Frago APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.1.10-APK
          path: output/Frago-1.1.10.apk
          if-no-files-found: error
          retention-days: 14
