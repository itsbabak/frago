
name: Build Frago Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Frago APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          PROJECT=""

          if [[ -f "$WORK/gradlew" ]]; then
            PROJECT="$WORK"
          else
            ZIP_FILE="$(find "$WORK" -maxdepth 5 \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' | head -n 1 || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Android source ZIP not found"
              exit 1
            fi

            mkdir -p "$WORK/frago-extracted"
            unzip -q "$ZIP_FILE" -d "$WORK/frago-extracted"

            PROJECT="$(find "$WORK/frago-extracted" \
              -type f -name gradlew -print -quit | xargs -r dirname)"
          fi

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -f "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)"
          fi

          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::SDK Manager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_HOME/ndk/28.2.13676358"

          if [[ ! -x "$NDK/ndk-build" ]]; then
            echo "::error::NDK installation incomplete"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          echo "NDK ready"

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          REQUIRED_FILES=(
            settings.gradle
            build.gradle
            gradlew
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
            app/build.gradle
            app/src/main/AndroidManifest.xml
            app/src/main/jni/Android.mk
            app/src/main/jni/Application.mk
            app/src/main/build-byedpi.sh
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Missing project file: $FILE"
              exit 1
            fi
          done

          chmod +x gradlew
          chmod +x app/src/main/build-byedpi.sh

          echo "Project files verified"

          echo "Android configuration:"
          grep -nE 'compileSdk|ndkVersion|abiFilters' \
            app/build.gradle || true

          echo "Native configuration:"
          cat app/src/main/jni/Application.mk

      - name: Build Frago Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            clean \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK was not generated"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f -name '*.apk' || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/Frago-1.1.10.apk"

          echo "APK generated successfully"
          ls -lh "$GITHUB_WORKSPACE/output/"
          sha256sum "$GITHUB_WORKSPACE/output/Frago-1.1.10.apk"

      - name: Upload Frago APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.1.10-APK
          path: output/Frago-1.1.10.apk
          if-no-files-found: error
          retention-days: 14
