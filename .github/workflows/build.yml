
name: Build Frago Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: frago-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Frago APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          PROJECT=""

          if [[ -f "$WORK/gradlew" ]]; then
            PROJECT="$WORK"
          else
            ZIP_FILE="$(find "$WORK" -maxdepth 5 \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' | head -n 1 || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Android source not found"
              exit 1
            fi

            mkdir -p "$WORK/frago-extracted"
            unzip -q "$ZIP_FILE" -d "$WORK/frago-extracted"

            PROJECT="$(find "$WORK/frago-extracted" \
              -type f -name gradlew -print -quit | xargs -r dirname)"
          fi

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Gradle project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | head -n 1)"
          fi

          test -x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_HOME/ndk/28.2.13676358"

          test -x "$NDK/ndk-build"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      # Add an alternative Maven Central mirror
      - name: Configure Maven mirrors
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          content = path.read_text()

          mirror = """
                  maven {
                      url 'https://maven-central.storage-download.googleapis.com/maven2'
                  }
          """

          if "maven-central.storage-download.googleapis.com" not in content:
              content = content.replace(
                  "mavenCentral()",
                  mirror + "\n        mavenCentral()"
              )

          path.write_text(content)

          print("Maven Central mirror configured")
          PY

          cat build.gradle

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          FILES=(
            settings.gradle
            build.gradle
            gradlew
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
            app/build.gradle
            app/src/main/AndroidManifest.xml
            app/src/main/jni/Android.mk
            app/src/main/jni/Application.mk
            app/src/main/build-byedpi.sh
          )

          for f in "${FILES[@]}"; do
            test -f "$f" || {
              echo "::error::Missing $f"
              exit 1
            }
          done

          chmod +x gradlew
          chmod +x app/src/main/build-byedpi.sh

          echo "Source validation passed"

      # Build with retry
      - name: Build Frago APK
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT

          ./gradlew \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            clean || exit 1

          SUCCESS=0

          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"

            if ./gradlew \
              --no-daemon \
              --max-workers=2 \
              --stacktrace \
              --refresh-dependencies \
              assembleDebug; then
              SUCCESS=1
              break
            fi

            echo "Build attempt $attempt failed"

            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 20))
            fi
          done

          if [[ "$SUCCESS" -ne 1 ]]; then
            echo "::error::Frago build failed after 3 attempts"
            exit 1
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK not generated"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" "$GITHUB_WORKSPACE/output/Frago-1.1.10.apk"

          ls -lh "$GITHUB_WORKSPACE/output/"
          sha256sum "$GITHUB_WORKSPACE/output/Frago-1.1.10.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.1.10-APK
          path: output/Frago-1.1.10.apk
          if-no-files-found: error
          retention-days: 14
