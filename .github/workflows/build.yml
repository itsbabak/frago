      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 2 -type f -iname '*.zip' \
            -not -path '*/output/*' \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "No source ZIP found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/frago-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/frago-source"

          PROJECT="$(find "$RUNNER_TEMP/frago-source" \
            -type f -name gradlew \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT" ]; then
            echo "Gradle project not found inside ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project extracted: $PROJECT"
