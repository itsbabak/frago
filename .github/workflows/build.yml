
name: Build Frago Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build Frago
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Extract source ZIP
      - name: Extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname '*.zip' \
            -not -path '*/output/*' \
            -printf '%T@\t%p\n' \
            | sort -nr | head -n 1 | cut -f2- || true)"

          if [[ -z "$ZIP" ]]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "Selected ZIP: $ZIP"

          mkdir -p "$RUNNER_TEMP/frago-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/frago-source"

          PROJECT="$(find "$RUNNER_TEMP/frago-source" \
            -type f -name gradlew \
            -print -quit | xargs -r dirname)"

          if [[ -z "$PROJECT" ]]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          if [[ ! -f "$PROJECT/app/build.gradle" && \
                ! -f "$PROJECT/app/build.gradle.kts" ]]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      # Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          test -x "$NDK/ndk-build"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      # Validate project
      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew

          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/src/main/AndroidManifest.xml

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

      # Go 1.27.3
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: Verify Go toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
          export GOTOOLCHAIN=auto

          go version
          go env GOVERSION
          go env GOTOOLCHAIN

      # Dependencies
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            python3 \
            python3-pip \
            unzip \
            zip \
            make \
            clang \
            cmake

      # Build libXray
      - name: Build libXray Android engine
        shell: bash
        run: |
          set -euo pipefail

          export GOTOOLCHAIN=auto
          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT

          mkdir -p "$PROJECT_DIR/app/libs"

          git clone --depth 1 \
            https://github.com/XTLS/libXray.git \
            "$RUNNER_TEMP/libXray"

          cd "$RUNNER_TEMP/libXray"

          echo "Go requirements:"
          head -n 10 go.mod

          go version

          python3 build/main.py android

          AAR="$(find "$RUNNER_TEMP/libXray" \
            -type f -iname '*.aar' \
            -print -quit)"

          if [[ -z "$AAR" || ! -s "$AAR" ]]; then
            echo "ERROR: libXray AAR was not generated."

            find "$RUNNER_TEMP/libXray" \
              -type f | grep -Ei '\.(aar|so)$' || true

            exit 1
          fi

          cp "$AAR" "$PROJECT_DIR/app/libs/libXray.aar"

          echo "Generated AAR:"
          ls -lh "$PROJECT_DIR/app/libs/libXray.aar"

          echo "Checking ARM64:"
          unzip -l "$PROJECT_DIR/app/libs/libXray.aar" \
            | grep 'jni/arm64-v8a/' || {
              echo "ERROR: ARM64 library missing."
              exit 1
            }

      # Automatically link AAR
      - name: Link Xray AAR to Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [[ ! -s app/libs/libXray.aar ]]; then
            echo "ERROR: libXray.aar not found."
            exit 1
          fi

          if [[ -f app/build.gradle.kts ]]; then
            GRADLE_FILE="app/build.gradle.kts"
          else
            GRADLE_FILE="app/build.gradle"
          fi

          python3 - "$GRADLE_FILE" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          if "libXray.aar" in text:
              print("Xray dependency already declared.")
              raise SystemExit(0)

          marker = "dependencies {"

          if marker not in text:
              raise SystemExit("ERROR: dependencies block not found.")

          if path.suffix == ".kts":
              dependency = '    implementation(files("libs/libXray.aar"))\n'
          else:
              dependency = "    implementation files('libs/libXray.aar')\n"

          text = text.replace(marker, marker + "\n" + dependency, 1)
          path.write_text(text)

          print("Xray AAR linked successfully.")
          PY

          grep -n -A10 "dependencies {" "$GRADLE_FILE"

      # Build APK
      - name: Build Frago APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT
          export GOTOOLCHAIN=auto

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      # Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)"

          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

          echo "APK size:"
          du -h "$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

          echo "SHA256:"
          sha256sum "$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

      # Verify architecture
      - name: Verify APK architecture
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/output/Frago-1.2.0.apk"

          unzip -l "$APK" | grep 'lib/arm64-v8a/' || {
            echo "WARNING: ARM64 native libraries not found."
          }

      # Upload APK
      - name: Upload Frago APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.2.0-Android-APK
          path: output/Frago-1.2.0.apk
          if-no-files-found: error
          retention-days: 30

      # Upload reports
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frago-Build-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
