
name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: frago-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Frago ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate and extract Frago project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          PROJECT=""

          # First: direct Android project
          if [ -f "$WORK/gradlew" ] && [ -f "$WORK/app/build.gradle" ]; then
            PROJECT="$WORK"
          fi

          # Second: locate project in repository subfolders
          if [ -z "$PROJECT" ]; then
            PROJECT="$(find "$WORK" -maxdepth 6 \
              -type f -name gradlew \
              -not -path '*/.git/*' \
              -print -quit | xargs -r dirname || true)"
          fi

          # Third: extract source ZIP
          if [ -z "$PROJECT" ]; then
            ZIP="$(find "$WORK" -maxdepth 4 \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2- || true)"

            if [ -n "$ZIP" ]; then
              echo "Extracting: $ZIP"

              mkdir -p "$WORK/frago-extracted"
              unzip -q "$ZIP" -d "$WORK/frago-extracted"

              PROJECT="$(find "$WORK/frago-extracted" \
                -maxdepth 8 -type f -name gradlew \
                -print -quit | xargs -r dirname || true)"
            fi
          fi

          if [ -z "$PROJECT" ] || \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "ERROR: Frago Android project not found."
            find "$WORK" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT"

          chmod +x "$PROJECT/gradlew"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK and ARM64 NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          test -x "$NDK/ndk-build"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Configure ARM64 only
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          # Android APK ABI filter
          gradle = Path("app/build.gradle")
          data = gradle.read_text()

          old = 'abiFilters "arm64-v8a", "armeabi-v7a"'
          if old not in data:
              raise SystemExit("Expected ABI filter not found in app/build.gradle")

          gradle.write_text(data.replace(
              old,
              'abiFilters "arm64-v8a"'
          ))

          # Native build script
          script = Path("app/src/main/build-byedpi.sh")
          data = script.read_text()

          data = data.replace(
              'APP_ABI="armeabi-v7a arm64-v8a"',
              'APP_ABI="arm64-v8a"'
          )

          data = data.replace(
              'for abi in armeabi-v7a arm64-v8a; do',
              'for abi in arm64-v8a; do'
          )

          script.write_text(data)

          # Native Application.mk
          app_mk = Path("app/src/main/jni/Application.mk")
          if app_mk.exists():
              data = app_mk.read_text()
              import re
              data = re.sub(
                  r'(?m)^APP_ABI\s*:=.*$',
                  'APP_ABI := arm64-v8a',
                  data
              )
              app_mk.write_text(data)

          print("ARM64-only configuration applied.")
          PY

          chmod +x app/src/main/build-byedpi.sh

          grep 'abiFilters' app/build.gradle
          grep 'APP_ABI' app/src/main/jni/Application.mk

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/jni/Android.mk
          test -f app/src/main/build-byedpi.sh

          grep -q 'gradle-8.13' \
            gradle/wrapper/gradle-wrapper.properties

          echo "Project validation successful."

      - name: Build Frago ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify ARM64 APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK not generated."
            exit 1
          fi

          echo "Checking APK architectures..."

          CONTENTS="$(unzip -Z1 "$APK")"

          echo "$CONTENTS" | grep '^lib/arm64-v8a/' \
            || {
              echo "ARM64 native libraries missing!"
              exit 1
            }

          if echo "$CONTENTS" | grep -E '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected architecture found!"
            exit 1
          fi

          echo "ARM64 verification successful."

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Frago-ARM64.apk"

          ls -lh "$GITHUB_WORKSPACE/output/Frago-ARM64.apk"

          sha256sum "$GITHUB_WORKSPACE/output/Frago-ARM64.apk"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APK
          path: output/Frago-ARM64.apk
          if-no-files-found: error
          retention-days: 14
