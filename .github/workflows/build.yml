
name: Build Frago 1.4.7 ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Frago Android APK
    runs-on: ubuntu-24.04

    steps:
      # 1. دریافت سورس
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. پیدا کردن پروژه یا استخراج ZIP
      - name: Locate or extract Frago project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            local root="$1"
            local wrapper
            local project

            while IFS= read -r -d '' wrapper; do
              project="$(dirname "$wrapper")"

              if [[ -f "$project/settings.gradle" || \
                    -f "$project/settings.gradle.kts" ]]; then

                if [[ -f "$project/app/build.gradle" || \
                      -f "$project/app/build.gradle.kts" ]]; then
                  printf '%s\n' "$project"
                  return 0
                fi
              fi
            done < <(
              find "$root" \
                -type f \
                -name gradlew \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' \
                -not -path '*/build/*' \
                -print0
            )

            return 1
          }

          PROJECT_DIR="$(find_project "$GITHUB_WORKSPACE" || true)"

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "Gradle project not found. Searching ZIP files..."

            EXTRACT_BASE="$GITHUB_WORKSPACE/.frago-extracted"
            mkdir -p "$EXTRACT_BASE"

            FOUND=false
            INDEX=0

            while IFS= read -r -d '' ARCHIVE; do
              INDEX=$((INDEX + 1))
              DEST="$EXTRACT_BASE/archive-$INDEX"

              mkdir -p "$DEST"

              echo "Extracting: $ARCHIVE"

              if ! unzip -oq "$ARCHIVE" -d "$DEST"; then
                continue
              fi

              PROJECT_DIR="$(find_project "$DEST" || true)"

              if [[ -n "$PROJECT_DIR" ]]; then
                FOUND=true
                break
              fi

            done < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 4 \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -not -path '*/.frago-extracted/*' \
                -print0
            )

            if [[ "$FOUND" != true ]]; then
              echo "::error::Frago project not found."
              exit 1
            fi
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 3. نصب Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. نصب Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 5. نصب SDK 36
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 6. اصلاح Gradle و تنظیمات Android
      - name: Configure Android Gradle build
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path(".")
          app_file = root / "app" / "build.gradle"
          root_file = root / "build.gradle"
          wrapper_file = root / "gradle" / "wrapper" / "gradle-wrapper.properties"

          if not app_file.exists():
              sys.exit("ERROR: app/build.gradle not found")

          if not root_file.exists():
              sys.exit("ERROR: root build.gradle not found")

          if not wrapper_file.exists():
              sys.exit("ERROR: Gradle wrapper properties not found")

          # Root Android Gradle Plugin
          root_text = root_file.read_text(encoding="utf-8")

          root_text, count = re.subn(
              r"com\.android\.tools\.build:gradle:[0-9.]+",
              "com.android.tools.build:gradle:8.10.1",
              root_text
          )

          if count == 0:
              sys.exit("ERROR: Android Gradle Plugin declaration not found")

          root_file.write_text(root_text, encoding="utf-8")

          # Gradle Wrapper
          wrapper_text = wrapper_file.read_text(encoding="utf-8")

          wrapper_text = re.sub(
              r"gradle-[0-9.]+-(?:all|bin)\.zip",
              "gradle-8.11.1-all.zip",
              wrapper_text
          )

          wrapper_file.write_text(wrapper_text, encoding="utf-8")

          # App Gradle
          app_text = app_file.read_text(encoding="utf-8")

          # Add namespace
          if not re.search(r"\bnamespace\s+['\"]", app_text):
              match = re.search(r"\bandroid\s*\{", app_text)

              if not match:
                  sys.exit("ERROR: android block not found")

              insert_at = match.end()

              app_text = (
                  app_text[:insert_at]
                  + "\n    namespace 'net.typeblog.socks'\n"
                  + app_text[insert_at:]
              )

          # Enable BuildConfig and AIDL
          build_features = re.search(
              r"\bbuildFeatures\s*\{",
              app_text
          )

          if not build_features:
              match = re.search(r"\bandroid\s*\{", app_text)

              if not match:
                  sys.exit("ERROR: android block not found")

              insert_at = match.end()

              app_text = (
                  app_text[:insert_at]
                  + """
              buildFeatures {
                  buildConfig true
                  aidl true
              }

          """
                  + app_text[insert_at:]
              )
          else:
              start = build_features.end()
              depth = 1
              pos = start

              while pos < len(app_text) and depth:
                  if app_text[pos] == "{":
                      depth += 1
                  elif app_text[pos] == "}":
                      depth -= 1
                  pos += 1

              block = app_text[build_features.start():pos]

              if not re.search(r"\bbuildConfig\s+true", block):
                  block = block[:-1] + "\n    buildConfig true\n}"

              if not re.search(r"\baidl\s+true", block):
                  block = block[:-1] + "\n    aidl true\n}"

              app_text = (
                  app_text[:build_features.start()]
                  + block
                  + app_text[pos:]
              )

          # Upgrade compile SDK
          if re.search(r"\bcompileSdkVersion\s+\d+", app_text):
              app_text = re.sub(
                  r"\bcompileSdkVersion\s+\d+",
                  "compileSdkVersion 36",
                  app_text,
                  count=1
              )
          elif re.search(r"\bcompileSdk\s+\d+", app_text):
              app_text = re.sub(
                  r"\bcompileSdk\s+\d+",
                  "compileSdk 36",
                  app_text,
                  count=1
              )
          else:
              app_text = re.sub(
                  r"(\bandroid\s*\{)",
                  r"\1\n    compileSdkVersion 36",
                  app_text,
                  count=1
              )

          # Upgrade target SDK
          if re.search(r"\btargetSdkVersion\s+\d+", app_text):
              app_text = re.sub(
                  r"\btargetSdkVersion\s+\d+",
                  "targetSdkVersion 36",
                  app_text,
                  count=1
              )
          elif re.search(r"\btargetSdk\s+\d+", app_text):
              app_text = re.sub(
                  r"\btargetSdk\s+\d+",
                  "targetSdk 36",
                  app_text,
                  count=1
              )
          else:
              app_text = re.sub(
                  r"(\bdefaultConfig\s*\{)",
                  r"\1\n        targetSdkVersion 36",
                  app_text,
                  count=1
              )

          app_file.write_text(app_text, encoding="utf-8")

          print("Android Gradle configuration updated.")
          print("AGP: 8.10.1")
          print("Gradle: 8.11.1")
          print("Namespace: net.typeblog.socks")
          print("BuildConfig: enabled")
          print("AIDL: enabled")
          print("compileSdk: 36")
          print("targetSdk: 36")
          PY

          echo "----- Updated app/build.gradle -----"
          cat app/build.gradle

      # 7. کنترل تنظیمات قبل از Build
      - name: Verify Android configuration
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          GRADLE_FILE="app/build.gradle"
          AIDL_FILE="app/src/main/aidl/net/typeblog/socks/IVpnService.aidl"

          test -f "$GRADLE_FILE"
          test -f "$AIDL_FILE"

          grep -q "namespace 'net.typeblog.socks'" "$GRADLE_FILE"
          grep -q "buildConfig true" "$GRADLE_FILE"
          grep -q "aidl true" "$GRADLE_FILE"
          grep -q "compileSdkVersion 36" "$GRADLE_FILE"
          grep -q "targetSdkVersion 36" "$GRADLE_FILE"

          echo "All required Android settings are enabled."
          echo "AIDL source:"
          cat "$AIDL_FILE"

      # 8. دانلود Xray ARM64
      - name: Download official Xray ARM64 core
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          XRAY_VERSION="v26.11.9"

          XRAY_SHA256="edcefc25b9b3195b11e18624c8269a969d6aabc39c6298a9a5ab29de15d46f3b"

          ARCHIVE="$RUNNER_TEMP/xray-android-arm64.zip"

          DOWNLOAD_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            -o "$ARCHIVE"

          echo "${XRAY_SHA256}  ${ARCHIVE}" | sha256sum --check -

          mkdir -p "$RUNNER_TEMP/xray-core"

          unzip -oq "$ARCHIVE" -d "$RUNNER_TEMP/xray-core"

          XRAY_BIN="$(
            find "$RUNNER_TEMP/xray-core" \
              -type f \
              -name xray \
              -print -quit
          )"

          if [[ -z "$XRAY_BIN" ]]; then
            echo "::error::Xray binary not found."
            exit 1
          fi

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets/xray

          install -m 755 \
            "$XRAY_BIN" \
            app/src/main/jniLibs/arm64-v8a/libxray.so

          curl -fL \
            --retry 3 \
            "https://raw.githubusercontent.com/XTLS/Xray-core/${XRAY_VERSION}/LICENSE" \
            -o app/src/main/assets/xray/LICENSE

          test -x app/src/main/jniLibs/arm64-v8a/libxray.so

          readelf -h app/src/main/jniLibs/arm64-v8a/libxray.so \
            | grep -Eq 'Machine:.*AArch64'

          echo "Xray ARM64 installed successfully."

      # 9. نصب و بررسی Gradle
      - name: Verify Gradle
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

      # 10. تولید BuildConfig و کامپایل AIDL
      - name: Generate BuildConfig and compile AIDL
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:generateDebugBuildConfig \
            :app:compileDebugAidl

          echo "Checking generated BuildConfig..."

          BUILD_CONFIG="$(
            find app/build \
              -type f \
              -name BuildConfig.java \
              -print -quit
          )"

          if [[ -z "$BUILD_CONFIG" ]]; then
            echo "::error::BuildConfig.java was not generated."
            exit 1
          fi

          echo "BuildConfig generated: $BUILD_CONFIG"

          echo "Checking generated AIDL..."

          AIDL_OUTPUT="$(
            find app/build \
              -type f \
              -name IVpnService.java \
              -print -quit
          )"

          if [[ -z "$AIDL_OUTPUT" ]]; then
            echo "::error::IVpnService.java was not generated."
            find app/build/generated -type f | head -100 || true
            exit 1
          fi

          echo "AIDL generated: $AIDL_OUTPUT"

      # 11. ساخت APK
      - name: Build Debug and Release APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug \
            assembleRelease

      # 12. پیدا کردن APKها
      - name: Find and verify APK outputs
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          APK_ROOT="$PROJECT_DIR/app/build/outputs/apk"

          echo "Searching in: $APK_ROOT"

          if [[ ! -d "$APK_ROOT" ]]; then
            echo "::error::APK output directory not found."
            exit 1
          fi

          DEBUG_APK="$(
            find "$APK_ROOT/debug" \
              -type f \
              -name '*.apk' \
              -print -quit 2>/dev/null || true
          )"

          RELEASE_APK="$(
            find "$APK_ROOT/release" \
              -type f \
              -name '*.apk' \
              -print -quit 2>/dev/null || true
          )"

          if [[ -z "$DEBUG_APK" ]]; then
            echo "::error::Debug APK not found."
            find "$APK_ROOT" -type f
            exit 1
          fi

          if [[ -z "$RELEASE_APK" ]]; then
            echo "::error::Release APK not found."
            find "$APK_ROOT" -type f
            exit 1
          fi

          echo "DEBUG APK:"
          ls -lh "$DEBUG_APK"

          echo "RELEASE APK:"
          ls -lh "$RELEASE_APK"

          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      # 13. آپلود Debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.4.7-ARM64-Debug
          path: ${{ steps.apk.outputs.debug_apk }}
          if-no-files-found: error
          retention-days: 14

      # 14. آپلود Release
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.4.7-ARM64-Release
          path: ${{ steps.apk.outputs.release_apk }}
          if-no-files-found: error
          retention-days: 14

      # 15. گزارش نهایی
      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Frago 1.4.7 ARM64"
            echo ""
            echo "- Build: Successful"
            echo "- Architecture: ARM64-v8a"
            echo "- Java: 17"
            echo "- Android SDK: 36"
            echo "- Android Gradle Plugin: 8.10.1"
            echo "- Gradle: 8.11.1"
            echo "- BuildConfig: Enabled"
            echo "- AIDL: Enabled"
            echo "- Xray: v26.11.9"
            echo "- Debug APK: Uploaded"
            echo "- Release APK: Uploaded"
          } >> "$GITHUB_STEP_SUMMARY"
