name: Build Frago WhiteDNS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Frago APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE"
          PROJECT=""

          echo "=== Repository Tree ==="
          find "$WORK" -maxdepth 4 -not -path '*/.git*'

          if [[ -f "$WORK/gradlew" && -f "$WORK/app/src/main/build-byedpi.sh" ]]; then
            PROJECT="$WORK"
          elif [[ -f "$WORK/Frago/gradlew" && -f "$WORK/Frago/app/src/main/build-byedpi.sh" ]]; then
            PROJECT="$WORK/Frago"
          else
            mkdir -p "$WORK/frago-extracted"
            while IFS= read -r -d '' zipf; do
              echo "Checking archive: $zipf"
              SUBDIR="$WORK/frago-extracted/$(basename "$zipf" .zip)"
              mkdir -p "$SUBDIR"
              unzip -q -o "$zipf" -d "$SUBDIR"
              FOUND="$(find "$SUBDIR" -type f -path '*/app/src/main/build-byedpi.sh' -print -quit || true)"
              if [[ -n "$FOUND" ]]; then
                PROJECT="$(dirname "$(dirname "$(dirname "$FOUND")")")"
                break
              fi
            done < <(find "$WORK" -not -path '*/.git/*' -type f -iname '*.zip' -print0)
          fi

          if [[ -z "$PROJECT" || ! -f "$PROJECT/app/build.gradle" ]]; then
            echo "ERROR: Frago project (with build-byedpi.sh) not found in repository!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Detected: $PROJECT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 and NDK 28
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          test -x "$NDK/ndk-build"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Validate Frago source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew app/src/main/build-byedpi.sh
          test -f settings.gradle
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/src/main/AndroidManifest.xml
          grep -q 'gradle-8.13' gradle/wrapper/gradle-wrapper.properties
          grep -q 'compileSdk 36' app/build.gradle
          java -version

      - name: Build Frago Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "ERROR: APK not generated"
            find "$PROJECT_DIR/app/build/outputs" -type f -name '*.apk' || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Frago-v57-WhiteDNS.apk"
          ls -lh "$GITHUB_WORKSPACE/output/Frago-v57-WhiteDNS.apk"
          sha256sum "$GITHUB_WORKSPACE/output/Frago-v57-WhiteDNS.apk"

      - name: Upload Frago APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-v57-WhiteDNS-APK
          path: output/Frago-v57-WhiteDNS.apk
          if-no-files-found: error
          retention-days: 14
