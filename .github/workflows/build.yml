
name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: frago-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Frago ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate and extract Frago
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          PROJECT=""

          if [ -f "$WORK/gradlew" ]; then
            PROJECT="$WORK"
          else
            ZIP="$(find "$WORK" -maxdepth 5 \
              -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -printf '%T@ %p\n' |
              sort -nr | head -1 | cut -d' ' -f2- || true)"

            if [ -n "$ZIP" ]; then
              mkdir -p "$WORK/frago-extracted"
              unzip -q "$ZIP" -d "$WORK/frago-extracted"

              PROJECT="$(find "$WORK/frago-extracted" \
                -type f -name gradlew \
                -print -quit | xargs -r dirname || true)"
            fi
          fi

          if [ -z "$PROJECT" ] || \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "Frago project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

          chmod +x "$PROJECT/gradlew"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK directory not found: $SDK"
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager \
              -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found!"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          if [ ! -x "$NDK/ndk-build" ]; then
            echo "NDK installation failed!"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Configure ARM64 only
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          # Gradle ABI filter
          gradle = Path("app/build.gradle")
          data = gradle.read_text()

          data, count = re.subn(
              r'abiFilters\s+["\']arm64-v8a["\']\s*,\s*["\']armeabi-v7a["\']',
              'abiFilters "arm64-v8a"',
              data
          )

          if count != 1:
              raise SystemExit("Could not configure Gradle ARM64 ABI filter")

          gradle.write_text(data)

          # NDK Application.mk
          app_mk = Path("app/src/main/jni/Application.mk")
          data = app_mk.read_text()

          data, count = re.subn(
              r'(?m)^APP_ABI\s*:=.*$',
              'APP_ABI := arm64-v8a',
              data
          )

          if count != 1:
              raise SystemExit("Could not configure Application.mk")

          app_mk.write_text(data)

          # ByeDPI and native engines build script
          script = Path("app/src/main/build-byedpi.sh")
          data = script.read_text()

          data, count = re.subn(
              r'APP_ABI="[^"]+"',
              'APP_ABI="arm64-v8a"',
              data
          )

          if count != 1:
              raise SystemExit("Could not configure native APP_ABI")

          data, count = re.subn(
              r'for abi in [^;]+; do',
              'for abi in arm64-v8a; do',
              data
          )

          if count != 2:
              raise SystemExit("Could not configure native ABI loops")

          data = data.replace(
              'ARMv7 and ARM64',
              'ARM64'
          )

          script.write_text(data)

          print("Gradle: ARM64")
          print("Application.mk: ARM64")
          print("ByeDPI: ARM64")
          PY

          chmod +x app/src/main/build-byedpi.sh

          echo "ARM64 configuration:"
          grep 'abiFilters' app/build.gradle
          grep 'APP_ABI' app/src/main/jni/Application.mk

      - name: Validate Frago source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f settings.gradle
          test -f build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/jni/Android.mk
          test -f app/src/main/build-byedpi.sh

          grep -q 'gradle-8.13' \
            gradle/wrapper/gradle-wrapper.properties

          grep -q 'compileSdk 36' app/build.gradle

          echo "Source validation successful."
          java -version

      - name: Build Frago ARM64
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify APK and Native Libraries
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK not generated!"
            exit 1
          fi

          CONTENTS="$(unzip -Z1 "$APK")"

          echo "$CONTENTS" | grep '^lib/arm64-v8a/' || {
            echo "ARM64 libraries missing!"
            exit 1
          }

          if echo "$CONTENTS" | grep -E '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "Unexpected ABI found!"
            exit 1
          fi

          for LIB in \
            libpdnsd.so \
            libtun2socks.so \
            libsystem.so \
            libbyedpi.so
          do
            echo "$CONTENTS" | grep -q "lib/arm64-v8a/$LIB" || {
              echo "Missing native library: $LIB"
              exit 1
            }
          done

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Frago-ARM64.apk"

          echo "APK verification successful."

          ls -lh "$GITHUB_WORKSPACE/output/Frago-ARM64.apk"

          sha256sum "$GITHUB_WORKSPACE/output/Frago-ARM64.apk"

      - name: Upload Frago ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APK
          path: output/Frago-ARM64.apk
          if-no-files-found: error
          retention-days: 14
