
name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Frago Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            local search_root="$1"
            local wrapper project_dir

            while IFS= read -r -d '' wrapper; do
              project_dir="$(dirname "$wrapper")"

              if [[ -f "$project_dir/settings.gradle" || -f "$project_dir/settings.gradle.kts" ]]; then
                if [[ -f "$project_dir/app/build.gradle" || -f "$project_dir/app/build.gradle.kts" ]]; then
                  printf '%s\n' "$project_dir"
                  return 0
                fi
              fi
            done < <(find "$search_root" -type f -name gradlew \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' -print0)

            return 1
          }

          PROJECT_DIR="$(find_project "$GITHUB_WORKSPACE" || true)"

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "Searching for source ZIP..."

            EXTRACT_BASE="$GITHUB_WORKSPACE/.frago-extracted"
            mkdir -p "$EXTRACT_BASE"

            found=false
            archive_index=0

            while IFS= read -r -d '' archive; do
              archive_index=$((archive_index + 1))
              extract_dir="$EXTRACT_BASE/archive-$archive_index"

              mkdir -p "$extract_dir"

              echo "Extracting: $archive"

              if ! unzip -qq "$archive" -d "$extract_dir"; then
                continue
              fi

              PROJECT_DIR="$(find_project "$extract_dir" || true)"

              if [[ -n "$PROJECT_DIR" ]]; then
                found=true
                break
              fi

            done < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname '*.zip' \
              -not -path '*/.git/*' \
              -not -path '*/.frago-extracted/*' -print0)

            if [[ "$found" != true ]]; then
              echo "ERROR: Android project not found!"
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort
              exit 1
            fi
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle" -o -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Found project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Verify environment
        shell: bash
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "Project: ${{ steps.locate.outputs.project_dir }}"

          test -x "${{ steps.locate.outputs.project_dir }}/gradlew"

      - name: Download Xray Android ARM64 core
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          XRAY_VERSION="v26.11.9"
          XRAY_SHA256="edcefc25b9b3195b11e18624c8269a969d6aabc39c6298a9a5ab29de15d46f3b"

          ARCHIVE="$RUNNER_TEMP/xray-android-arm64.zip"

          curl -fL --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip" \
            -o "$ARCHIVE"

          echo "${XRAY_SHA256}  ${ARCHIVE}" | sha256sum --check -

          mkdir -p "$RUNNER_TEMP/xray-core"

          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/xray-core"

          XRAY_BIN="$(find "$RUNNER_TEMP/xray-core" -type f -name xray -print -quit)"

          test -n "$XRAY_BIN"

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets/xray

          install -m 755 "$XRAY_BIN" \
            app/src/main/jniLibs/arm64-v8a/libxray.so

          curl -fL \
            "https://raw.githubusercontent.com/XTLS/Xray-core/${XRAY_VERSION}/LICENSE" \
            -o app/src/main/assets/xray/LICENSE

          test -x app/src/main/jniLibs/arm64-v8a/libxray.so

          readelf -h app/src/main/jniLibs/arm64-v8a/libxray.so \
            | grep -Eq 'Machine:.*AArch64'

          file app/src/main/jniLibs/arm64-v8a/libxray.so

      - name: Build Frago APKs
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-debug
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-release
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
