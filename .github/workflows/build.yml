
name: Frago Android ARM64 Build

on:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/build-arm64-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -iname '*.zip' ! -iname '*logs*' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found in repository root."
            exit 1
          fi

          echo "Using source: $ZIP"

          mkdir -p "$RUNNER_TEMP/frago-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/frago-source"

          PROJECT_ROOT="$(find "$RUNNER_TEMP/frago-source" -type f -name gradlew -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: No gradlew found inside source ZIP."
            echo "ZIP contents:"
            find "$RUNNER_TEMP/frago-source" -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_ROOT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;27.2.12479018"

      - name: Check project files
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          echo "Project root: $PWD"
          test -f gradlew
          test -f settings.gradle -o -f settings.gradle.kts
          chmod +x gradlew
          find . -maxdepth 3 -type f | sort | head -n 100

      - name: Build ARM64 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK output
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/frago-apk"

          find . -type f -name '*.apk' -print

          APK="$(find . -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/frago-apk/"

          echo "APK generated successfully:"
          ls -lh "$GITHUB_WORKSPACE/frago-apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frago-Android-APK
          path: frago-apk/*.apk
          if-no-files-found: error
          retention-days: 14
