
name: Build Frago Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: frago-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Frago APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT=""

          if [ -f "$GITHUB_WORKSPACE/gradlew" ]; then
            PROJECT="$GITHUB_WORKSPACE"
          else
            PROJECT="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 5 \
              -type f \
              -name gradlew \
              -not -path '*/.git/*' \
              -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT" ]; then
            echo "Android project not found!"
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "app/build.gradle not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

          echo "Android project: $PROJECT"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"

          if [ ! -x "$NDK/ndk-build" ]; then
            echo "NDK installation failed!"
            exit 1
          fi

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          chmod +x gradlew
          chmod +x app/src/main/build-byedpi.sh

          test -f settings.gradle
          test -f build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/jni/Android.mk

          echo "Source validation successful."

          java -version

      - name: Build Frago Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          export ANDROID_NDK_HOME
          export ANDROID_NDK_ROOT

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verify native libraries
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          for ABI in arm64-v8a armeabi-v7a; do

            DIR="app/src/main/jniLibs/$ABI"

            for LIB in \
              libpdnsd.so \
              libtun2socks.so \
              libsystem.so \
              libbyedpi.so
            do

              if [ ! -s "$DIR/$LIB" ]; then
                echo "Missing native component: $ABI/$LIB"
                exit 1
              fi

            done

            echo "Verified: $ABI"

          done

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK not generated!"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/Frago-Android.apk"

          echo "APK generated successfully."

          ls -lh "$GITHUB_WORKSPACE/output/Frago-Android.apk"

          sha256sum "$GITHUB_WORKSPACE/output/Frago-Android.apk"

      - name: Upload Frago APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-Android-APK
          path: output/Frago-Android.apk
          if-no-files-found: error
          retention-days: 14
