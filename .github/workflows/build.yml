
name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Find Android project or extract source ZIP
      - name: Locate Frago project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            local root="$1"
            local wrapper
            local dir

            while IFS= read -r -d '' wrapper; do
              dir="$(dirname "$wrapper")"

              if [[ ( -f "$dir/settings.gradle" || -f "$dir/settings.gradle.kts" ) &&
                    ( -f "$dir/app/build.gradle" || -f "$dir/app/build.gradle.kts" ) ]]; then
                printf '%s\n' "$dir"
                return 0
              fi

            done < <(
              find "$root" -type f -name gradlew \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' \
                -not -path '*/build/*' \
                -print0
            )

            return 1
          }

          PROJECT_DIR="$(find_project "$GITHUB_WORKSPACE" || true)"

          EXTRACT_ROOT="$RUNNER_TEMP/frago-extracted"
          mkdir -p "$EXTRACT_ROOT"

          if [[ -z "$PROJECT_DIR" ]]; then

            echo "Searching for source ZIP files..."

            while IFS= read -r -d '' archive; do

              dest="$EXTRACT_ROOT/archive-$RANDOM-$RANDOM"
              mkdir -p "$dest"

              echo "Extracting: $archive"

              unzip -oq "$archive" -d "$dest"

            done < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 6 \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' \
                -print0
            )

            PROJECT_DIR="$(find_project "$EXTRACT_ROOT" || true)"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then

            echo "::error::Frago Android project not found."

            echo "Expected files:"
            echo "gradlew"
            echo "settings.gradle"
            echo "app/build.gradle"

            find "$GITHUB_WORKSPACE" "$EXTRACT_ROOT" \
              -maxdepth 7 -type f | sort | head -300

            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Frago project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "platform-tools"

      # Gradle compatibility
      - name: Set up Java 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # Build
      - name: Build Frago APKs
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --no-daemon clean assembleDebug assembleRelease

          echo "Generated APK files:"

          find app/build/outputs \
            -type f \
            -name '*.apk' \
            -print || true

      # Collect APKs without assuming fixed filenames
      - name: Collect generated APKs
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          DEST="$GITHUB_WORKSPACE/apk-artifacts"

          mkdir -p "$DEST"

          COUNT=0

          while IFS= read -r -d '' apk; do

            REL="${apk#"$PROJECT_DIR"/app/build/outputs/apk/}"

            SAFE_NAME="$(printf '%s' "$REL" | tr '/ ' '__')"

            cp "$apk" "$DEST/$SAFE_NAME"

            echo "Collected: $SAFE_NAME"

            COUNT=$((COUNT + 1))

          done < <(
            find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name '*.apk' \
              -print0 2>/dev/null || true
          )

          if [[ "$COUNT" -eq 0 ]]; then

            echo "::error::No APK files were generated."

            echo "Build output contents:"

            find "$PROJECT_DIR/app/build/outputs" \
              -maxdepth 8 -type f -print 2>/dev/null || true

            exit 1
          fi

          echo "Successfully collected $COUNT APK file(s)."

      # Upload
      - name: Upload Frago APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Frago-APK
          path: apk-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
