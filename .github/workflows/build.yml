
name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Frago Android APK
    runs-on: ubuntu-24.04

    steps:
      # 1. دریافت مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. پیدا کردن پروژه یا استخراج ZIP سورس
      - name: Locate or extract Frago Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            local search_root="$1"
            local wrapper
            local project_dir

            while IFS= read -r -d '' wrapper; do
              project_dir="$(dirname "$wrapper")"

              if [[ -f "$project_dir/settings.gradle" || \
                    -f "$project_dir/settings.gradle.kts" ]]; then

                if [[ -f "$project_dir/app/build.gradle" || \
                      -f "$project_dir/app/build.gradle.kts" ]]; then
                  printf '%s\n' "$project_dir"
                  return 0
                fi
              fi
            done < <(
              find "$search_root" \
                -type f \
                -name gradlew \
                -not -path '*/.git/*' \
                -not -path '*/.gradle/*' \
                -not -path '*/build/*' \
                -print0
            )

            return 1
          }

          PROJECT_DIR="$(find_project "$GITHUB_WORKSPACE" || true)"

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "Gradle project not found directly."
            echo "Searching for source ZIP..."

            EXTRACT_BASE="$GITHUB_WORKSPACE/.frago-extracted"
            mkdir -p "$EXTRACT_BASE"

            found=false
            archive_index=0

            while IFS= read -r -d '' archive; do
              archive_index=$((archive_index + 1))

              extract_dir="$EXTRACT_BASE/archive-$archive_index"
              mkdir -p "$extract_dir"

              echo "Extracting: $archive"

              if ! unzip -qq "$archive" -d "$extract_dir"; then
                echo "Skipping invalid ZIP."
                continue
              fi

              PROJECT_DIR="$(find_project "$extract_dir" || true)"

              if [[ -n "$PROJECT_DIR" ]]; then
                found=true
                break
              fi

            done < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 4 \
                -type f \
                -iname '*.zip' \
                -not -path '*/.git/*' \
                -not -path '*/.frago-extracted/*' \
                -print0
            )

            if [[ "$found" != true ]]; then
              echo "::error::Frago Android project was not found."
              find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort
              exit 1
            fi
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"

          test -f "$PROJECT_DIR/gradlew"

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" || \
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Frago project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 3. نصب Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. نصب Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 5. نصب ابزارهای Android 36
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # 6. بررسی محیط ساخت
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version

          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          test -x "$PROJECT_DIR/gradlew"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      # 7. دریافت موتور رسمی Xray برای ARM64
      - name: Download official Xray ARM64 core
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          XRAY_VERSION="v26.11.9"

          XRAY_SHA256="edcefc25b9b3195b11e18624c8269a969d6aabc39c6298a9a5ab29de15d46f3b"

          ARCHIVE="$RUNNER_TEMP/xray-android-arm64.zip"

          DOWNLOAD_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"

          echo "Downloading Xray ${XRAY_VERSION}..."

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            -o "$ARCHIVE"

          echo "Checking SHA256..."

          echo "${XRAY_SHA256}  ${ARCHIVE}" | sha256sum --check -

          mkdir -p "$RUNNER_TEMP/xray-core"

          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/xray-core"

          XRAY_BIN="$(
            find "$RUNNER_TEMP/xray-core" \
              -type f \
              -name xray \
              -print -quit
          )"

          if [[ -z "$XRAY_BIN" ]]; then
            echo "::error::Xray binary not found in archive."
            exit 1
          fi

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets/xray

          install -m 755 \
            "$XRAY_BIN" \
            app/src/main/jniLibs/arm64-v8a/libxray.so

          curl -fL \
            --retry 3 \
            "https://raw.githubusercontent.com/XTLS/Xray-core/${XRAY_VERSION}/LICENSE" \
            -o app/src/main/assets/xray/LICENSE

          test -x app/src/main/jniLibs/arm64-v8a/libxray.so

          echo "Checking ARM64 architecture..."

          readelf -h app/src/main/jniLibs/arm64-v8a/libxray.so \
            | grep -Eq 'Machine:.*AArch64'

          file app/src/main/jniLibs/arm64-v8a/libxray.so

          echo "Xray ARM64 installed successfully."

      # 8. بررسی AIDL و فایل‌های ضروری
      - name: Verify Frago source files
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "Checking required source files..."

          test -f gradlew
          test -d app/src/main

          AIDL_FILE="app/src/main/aidl/net/typeblog/socks/IVpnService.aidl"

          if [[ ! -f "$AIDL_FILE" ]]; then
            echo "::error::Required AIDL file is missing: $AIDL_FILE"
            exit 1
          fi

          echo "AIDL file found."

          echo "Checking Android manifest..."

          test -f app/src/main/AndroidManifest.xml

          echo "Source verification completed."

      # 9. ساخت APK
      - name: Build Debug and Release APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug \
            assembleRelease

      # 10. پیدا کردن APKها در مسیر واقعی پروژه
      - name: Find and verify APK outputs
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          APK_ROOT="$PROJECT_DIR/app/build/outputs/apk"

          echo "Searching APK files in:"
          echo "$APK_ROOT"

          if [[ ! -d "$APK_ROOT" ]]; then
            echo "::error::APK output directory does not exist."
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 6 -type f || true
            exit 1
          fi

          DEBUG_APK="$(
            find "$APK_ROOT/debug" \
              -type f \
              -name '*.apk' \
              -print -quit 2>/dev/null || true
          )"

          RELEASE_APK="$(
            find "$APK_ROOT/release" \
              -type f \
              -name '*.apk' \
              -print -quit 2>/dev/null || true
          )"

          if [[ -z "$DEBUG_APK" ]]; then
            echo "::error::Debug APK not found."
            find "$APK_ROOT" -type f -print
            exit 1
          fi

          if [[ -z "$RELEASE_APK" ]]; then
            echo "::error::Release APK not found."
            find "$APK_ROOT" -type f -print
            exit 1
          fi

          echo "Debug APK:"
          ls -lh "$DEBUG_APK"

          echo "Release APK:"
          ls -lh "$RELEASE_APK"

          echo "debug_apk=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

          echo "APK verification successful."

      # 11. آپلود نسخه Debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.4.7-ARM64-Debug
          path: ${{ steps.apk.outputs.debug_apk }}
          if-no-files-found: error
          retention-days: 14

      # 12. آپلود نسخه Release
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-1.4.7-ARM64-Release
          path: ${{ steps.apk.outputs.release_apk }}
          if-no-files-found: error
          retention-days: 14

      # 13. نمایش خلاصه خروجی
      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Frago 1.4.7 ARM64 Build"
            echo ""
            echo "Build completed successfully."
            echo ""
            echo "- Debug APK: uploaded"
            echo "- Release APK: uploaded"
            echo "- Architecture: ARM64-v8a"
            echo "- Android SDK: 36"
            echo "- Java: 17"
            echo "- Xray: v26.11.9"
          } >> "$GITHUB_STEP_SUMMARY"
