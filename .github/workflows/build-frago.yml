name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "platform-tools"

      - name: Build Frago release APK (ARM64)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_SIZE_BYTES=$(stat -c%s "$APK")
          echo "APK_SIZE_BYTES=$APK_SIZE_BYTES" >> "$GITHUB_ENV"
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

      - name: Report APK size and checksum
        run: |
          echo "### Frago ARM64 APK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Size: ${APK_SIZE_BYTES} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: ${APK_SHA256}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$APK_SIZE_BYTES" -gt 2097152 ]; then
            echo "- Warning: APK is larger than the 2 MiB target." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Size target: passed (at most 2 MiB)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Frago APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
