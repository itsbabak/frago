name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Android command-line tools are run with JDK 17.
      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          java -version
          sdkmanager --version
          # Feed a finite batch of affirmative answers. This avoids the
          # `yes | sdkmanager` SIGPIPE/Broken-pipe failure.
          sdkmanager --licenses <<< "$(printf 'y\n%.0s' {1..100})"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "platform-tools"

      # AGP 7.1.3 / Gradle 7.2 build stage uses JDK 11.
      - name: Set up JDK 11 for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Locate Frago project root
        id: locate-project
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find "$GITHUB_WORKSPACE" -type f -name gradlew \
            -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew was not found in the checked-out repository."
            echo "Make sure you extracted the source ZIP and committed its contents, not the ZIP file itself."
            echo "Repository files near the root:"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
              \( -name gradlew -o -name settings.gradle -o -name build.gradle \) \
              -print | sed -n '1,100p'
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Found gradlew at $PROJECT_DIR, but no settings.gradle(.kts) beside it."
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Found Gradle root at $PROJECT_DIR, but app/build.gradle(.kts) is missing."
            exit 1
          fi

          echo "Frago project root: $PROJECT_DIR"
          echo "FRAGO_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAGO_PROJECT_DIR"
          java -version
          chmod +x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Build Frago release APK (ARM64)
        shell: bash
        run: |
          set -euo pipefail
          cd "$FRAGO_PROJECT_DIR"
          ./gradlew --no-daemon clean assembleRelease
          APK="$FRAGO_PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_SIZE_BYTES=$(stat -c%s "$APK")
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "APK_SIZE_BYTES=$APK_SIZE_BYTES" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

      - name: Report APK size and checksum
        shell: bash
        run: |
          {
            echo "### Frago ARM64 APK"
            echo "- Size: ${APK_SIZE_BYTES} bytes"
            echo "- SHA-256: ${APK_SHA256}"
            if [ "$APK_SIZE_BYTES" -gt 2097152 ]; then
              echo "- Warning: APK is larger than the 2 MiB target."
            else
              echo "- Size target: passed (at most 2 MiB)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Frago APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APK
          path: '**/app/build/outputs/apk/release/app-release.apk'
          if-no-files-found: error
          retention-days: 14
