name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Frago source
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-31" "build-tools;31.0.0" "ndk;27.2.12479018"

      - name: Verify Frago JSON and Android project
        run: python3 tools/verify_project.py

      - name: Build lightweight Hev SOCKS5 TUN engine (ARM64 only)
        shell: bash
        run: |
          set -euo pipefail
          HEV_ROOT="$RUNNER_TEMP/hev-android-build"
          mkdir -p "$HEV_ROOT"
          git clone --depth 1 --branch 2.20.0 --recurse-submodules \
            https://github.com/heiher/hev-socks5-tunnel.git "$HEV_ROOT/jni"
          "$ANDROID_SDK_ROOT/ndk/27.2.12479018/ndk-build" -C "$HEV_ROOT" APP_ABI=arm64-v8a
          LIB="$(find "$HEV_ROOT" -type f -path '*/arm64-v8a/libhev-socks5-tunnel.so' -print -quit)"
          test -n "$LIB"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 644 "$LIB" app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so | grep -Eq 'Machine:.*AArch64'
          sha256sum app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          cp "$HEV_ROOT/jni/LICENSE" THIRD_PARTY_HEV_LICENSE.txt
          mkdir -p app/src/main/assets
          cp "$HEV_ROOT/jni/LICENSE" app/src/main/assets/THIRD_PARTY_HEV_LICENSE.txt

      - name: Build debug and optimized APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Verify APK ABI and absence of Xray
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          unzip -l "$APK" | awk 'NF == 4 { print $4 }' > "$RUNNER_TEMP/apk-files.txt"
          grep -qx 'lib/arm64-v8a/libhev-socks5-tunnel.so' "$RUNNER_TEMP/apk-files.txt"
          if grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/|libxray' "$RUNNER_TEMP/apk-files.txt"; then
            echo 'Unexpected ABI or Xray binary in APK' >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized APK and third-party notices
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            THIRD_PARTY_HEV_LICENSE.txt
          if-no-files-found: error
          retention-days: 14
