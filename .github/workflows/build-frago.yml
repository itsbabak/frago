name: Build Frago ARM64 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Android command-line tools are run with JDK 17.
      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          java -version
          sdkmanager --version
          # Process substitution prevents `yes` receiving SIGPIPE from
          # turning a successful license acceptance into exit code 141.
          sdkmanager --licenses < <(yes) >/dev/null

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "platform-tools"

      # AGP 7.1.3 / Gradle 7.2 build stage.
      - name: Set up JDK 11 for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Frago release APK (ARM64)
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APK_SIZE_BYTES=$(stat -c%s "$APK")
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "APK_SIZE_BYTES=$APK_SIZE_BYTES" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

      - name: Report APK size and checksum
        shell: bash
        run: |
          {
            echo "### Frago ARM64 APK"
            echo "- Size: ${APK_SIZE_BYTES} bytes"
            echo "- SHA-256: ${APK_SHA256}"
            if [ "$APK_SIZE_BYTES" -gt 2097152 ]; then
              echo "- Warning: APK is larger than the 2 MiB target."
            else
              echo "- Size target: passed (at most 2 MiB)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Frago APK
        uses: actions/upload-artifact@v4
        with:
          name: Frago-ARM64-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
